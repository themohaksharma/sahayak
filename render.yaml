services:
  - type: web
    name: sahayak-api-themohaksharma
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CHARIOT_API_KEY
        sync: false
      - key: SAHAYAK_ALLOWED_ORIGINS
        value: https://themohaksharma.github.io
